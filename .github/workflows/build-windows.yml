name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15 (Win7 compatible)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      # Windows 7 兼容关键：安装 MSVC 2019 (v142) 工具集
      # MSVC 2022 (v143) 的新版运行时 (14.40+) 已放弃 Win7，v142 的 14.29 运行时仍支持 Win7
      - name: Install MSVC 2019 (v142) toolset for Win7
        shell: powershell
        run: |
          $bootstrapper = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS install: $installPath"
          & $bootstrapper modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --passive --norestart
          if ($LASTEXITCODE -ne 0) { Write-Error "v142 toolset install failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: Configure CMake (v142 toolset)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-T v142"

      - name: Build SpecAnalyzer-FWHM only
        run: cmake --build build --config Release --target SpecAnalyzer-FWHM

      - name: Deploy Qt DLLs + MSVC 2019 runtime (Win7 compatible)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build\Release\SpecAnalyzer-FWHM.exe package\
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS path: $vsPath"
          # 在 v142 环境中运行 windeployqt，--compiler-runtime 会自动复制 MSVC 2019 (14.29) 运行时 + UCRT
          $cmdLine = 'call "' + $vsPath + '\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29 >nul && windeployqt package\SpecAnalyzer-FWHM.exe --no-translations --compiler-runtime'
          # 不用 --compiler-runtime：windeployqt 会部署非 Win7 的 vc_redist 安装器。
          # 改为 windeployqt 后手动从 MSVC 2019 (14.29) 目录复制运行库 DLL，Win7 兼容且免安装。
          windeployqt package\SpecAnalyzer-FWHM.exe --no-translations
          # --- 内置 MSVC 2019 (14.29) CRT 运行库 ---
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match "Microsoft\.VC142\.CRT" -and $_.FullName -match "\\x64\\" -and $_.FullName -notmatch "onecore" }
          Write-Host "CRT DLLs found: $($crt.Count)"
          $crt | ForEach-Object { Copy-Item $_.FullName package\ -Force }
          # --- 内置 UCRT (14.29 onecore) ---
          $ucrt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match "Microsoft\.VC142\.UCRT" -and $_.FullName -match "\\x64\\" }
          Write-Host "UCRT DLLs found: $($ucrt.Count)"
          $ucrt | ForEach-Object { Copy-Item $_.FullName package\ -Force }
          # --- UCRT 兜底：Windows Kits SDK ---
          if (-not (Get-ChildItem package\ -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue)) {
              Write-Host "UCRT not found in VC redist, falling back to Windows Kits"
              Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\ucrt\DLLs\x64" -File -Filter "*.dll" -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName package\ -Force }
          }
          # --- 移除 windeployqt 可能带来的非 Win7 redist 安装器 ---
          Remove-Item package\vc_redist.x64.exe -Force -ErrorAction SilentlyContinue
          # --- 验证运行库已打入 ---
          Write-Host "-- runtime DLLs in package --"
          Get-ChildItem package\ -Filter "*.dll" | Where-Object { $_.Name -match "msvcp|vcruntime|ucrt|concrt|api-ms" } | Select-Object -ExpandProperty Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecAnalyzer-FWHM-Windows
          path: package/
