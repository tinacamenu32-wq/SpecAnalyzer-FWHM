name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15 (Win7 compatible)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      # Windows 7 兼容关键：安装 MSVC 2019 (v142) 工具集
      # MSVC 2022 (v143) 的新版运行时 (14.40+) 已放弃 Win7，v142 的 14.29 运行时仍支持 Win7
      - name: Install MSVC 2019 (v142) toolset for Win7
        shell: powershell
        run: |
          $bootstrapper = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS install: $installPath"
          & $bootstrapper modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --passive --norestart
          if ($LASTEXITCODE -ne 0) { Write-Error "v142 toolset install failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: Configure CMake (v142 toolset)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-T v142"

      - name: Build SpecAnalyzer-FWHM only
        run: cmake --build build --config Release --target SpecAnalyzer-FWHM

      - name: Deploy Qt DLLs + MSVC 2019 runtime (Win7 compatible)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build\Release\SpecAnalyzer-FWHM.exe package\
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS path: $vsPath"
          # 在 v142 环境中运行 windeployqt，--compiler-runtime 会自动复制 MSVC 2019 (14.29) 运行时 + UCRT
          $cmdLine = 'call "' + $vsPath + '\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29 >nul && windeployqt package\SpecAnalyzer-FWHM.exe --no-translations --compiler-runtime'
          cmd /c $cmdLine
          # 兜底 1：从 v142 工具目录复制 CRT 运行库
          Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll") } |
            ForEach-Object { Copy-Item $_.FullName package\ -Force }
          # 兜底 2：从 Windows SDK 复制 UCRT
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\*\ucrt\DLLs\x64" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "ucrtbase.dll" -or $_.Name -like "api-ms-win-*" } |
            ForEach-Object { Copy-Item $_.FullName package\ -Force }
          # 验证运行时已打入
          Get-ChildItem package\ -Filter "*.dll" | Where-Object { $_.Name -match "msvcp|vcruntime|ucrt" } | Select-Object -ExpandProperty Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecAnalyzer-FWHM-Windows
          path: package/
