name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15 (Win7 compatible)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build SpecAnalyzer-FWHM only
        run: cmake --build build --config Release --target SpecAnalyzer-FWHM

      - name: Deploy Qt DLLs
        run: |
          mkdir package
          copy build\Release\SpecAnalyzer-FWHM.exe package\
          windeployqt package\SpecAnalyzer-FWHM.exe --no-translations --compiler-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecAnalyzer-FWHM-Windows
          path: package/
