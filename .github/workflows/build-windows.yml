name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.15 (Win7 compatible)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts'

      # Windows 7 兼容关键：安装 MSVC 2019 (v142) 工具集
      # MSVC 2022 (v143) 的新版运行时 (14.40+) 已放弃 Win7，v142 的 14.29 运行时仍支持 Win7
      - name: Install MSVC 2019 (v142) toolset for Win7
        shell: powershell
        run: |
          $bootstrapper = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS install: $installPath"
          & $bootstrapper modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --passive --norestart
          if ($LASTEXITCODE -ne 0) { Write-Error "v142 toolset install failed (exit $LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: Configure CMake (v142 toolset)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-T v142"

      - name: Build SpecAnalyzer-FWHM only
        run: cmake --build build --config Release --target SpecAnalyzer-FWHM

      - name: Deploy Qt DLLs + MSVC 2019 runtime (Win7 compatible)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build\Release\SpecAnalyzer-FWHM.exe package\
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS path: $vsPath"
          # 在 v142 环境中运行 windeployqt，--compiler-runtime 会自动复制 MSVC 2019 (14.29) 运行时 + UCRT
          $cmdLine = 'call "' + $vsPath + '\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29 >nul && windeployqt package\SpecAnalyzer-FWHM.exe --no-translations --compiler-runtime'
          cmd /c $cmdLine
          # ===== 诊断：定位 runner 上所有 vcruntime140.dll 的实际位置 =====
          Write-Host "===== DIAG START ====="
          Write-Host "-- VC\Redist tree --"
          Get-ChildItem "$vsPath\VC\Redist" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-String -Width 300 | Write-Host
          Write-Host "-- vcruntime140.dll under VS --"
          Get-ChildItem "$vsPath\VC" -Recurse -Filter "vcruntime140.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-String -Width 300 | Write-Host
          Write-Host "-- ucrtbase.dll under Windows Kits Redist --"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Recurse -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-String -Width 300 | Write-Host
          Write-Host "-- vc_redist.x64.exe under VS --"
          Get-ChildItem "$vsPath\VC" -Recurse -Filter "vc_redist.x64.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-String -Width 300 | Write-Host
          Write-Host "===== DIAG END ====="
          # ===== 尝试从 VC\Redist 复制 CRT + UCRT DLL =====
          Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC142.CRT" -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName package\ -Force }
          Get-ChildItem "$vsPath\VC\Redist\MSVC\*\onecore\x64\Microsoft.VC142.UCRT" -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName package\ -Force }
          # ===== 验证运行库已打入 =====
          Write-Host "-- runtime DLLs in package --"
          Get-ChildItem package\ -Filter "*.dll" | Where-Object { $_.Name -match "msvcp|vcruntime|ucrt|concrt" } | Select-Object -ExpandProperty Name | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecAnalyzer-FWHM-Windows
          path: package/
