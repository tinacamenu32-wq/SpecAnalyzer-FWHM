name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Deploy
        run: |
          windeployqt build/Release/SpecAnalyzer.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecAnalyzer-Windows
          path: build/Release/
